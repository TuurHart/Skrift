name: SkriftDesktop
options:
  bundleIdPrefix: com.skrift
  deploymentTarget:
    # 15.0 since 2026-07-16: the CoreML-LLM package (shared GemmaEmbedder for the
    # Connections panel) declares macOS 15 as its floor. Was 14.0.
    macOS: "15.0"
  createIntermediateGroups: true

packages:
  # Pinned to the exact commit the June-2026 builds verified — same pin as the
  # iOS app (one engine, two apps); upgrade both together, deliberately.
  FluidAudio:
    url: https://github.com/FluidInference/FluidAudio.git
    revision: 19600a485baa4998812e4654b70d2bab8f2c9949  # v0.15.5, bumped 2026-07-21 (📖 spike 3: #683 seam-glue fixes in 0.15.3+0.15.5; was 7f963cdc = v0.15.2)
  # 📖 ePub extraction (spike 4): an .epub is a zip; no system unzip API. Approved as
  # SPM dep #2 (Tuur 2026-07-21). MIT, zero transitive deps. Desktop-only until the
  # phone's attach-ePub UX lands (spike 6). Revision = the 0.9.20 tag.
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation.git
    revision: 86fc841708997c5bce8545e23845125f4eb28493  # 0.9.20, pinned 2026-07-21
  # mlx-swift LLM stack for enhancement (gemma4 registered on main). 3.x decoupled
  # the downloader/tokenizer → swift-huggingface + swift-transformers integrations.
  mlx-swift-lm:
    url: https://github.com/ml-explore/mlx-swift-lm
    # Bumped 2026-08-12 a47894a1 → e6e3de75 (2026-07-21, +2 days). THE FLOOR: this is
    # where Gemma4Text's kProj/vProj became OPTIONAL for KV-shared layers. Below it the
    # current gemma-4-e4b-it-8bit upload cannot load at all — "Key ...layers.24
    # .self_attn.k_proj.weight not found" — which is what broke Polish on the iPad while
    # the Mac's June cache of the OLD upload kept working. It also sanitizes the redundant
    # tensors out of that old upload, so it loads either revision. Do not drop below this.
    # Bumped 2026-09-21 e6e3de75 → 14414441 (upstream #544, merged 2026-08-22): Xcode 27.0 arrived
    # on this Mac 2026-09-15 and e6e3de75's MLXFoundationModels no longer compiles against the FM-27
    # SDK ("extraneous argument label 'capabilities:'"). #544 (+#538 below it) is the smallest
    # commit that fixes it. Same pin on the phone. Polish load on the iPad owed a re-check.
    revision: 14414441fa44f45eee35a61e9fa0bab577cf9734
  swift-huggingface:
    url: https://github.com/huggingface/swift-huggingface
    from: "0.9.0"
  swift-transformers:
    url: https://github.com/huggingface/swift-transformers
    # Pinned 2026-07-13 (was from: "1.3.0" — floating): a fresh regenerate resolved
    # 1.3.3, whose Hub/Config.swift doesn't compile against this project's Swift 5.9
    # (ObjectKey dictionary-key error) → full-scheme build red. Package.resolved lives
    # in the gitignored .xcodeproj, so ONLY exact pins are reproducible here.
    exactVersion: "1.3.0"
  # TRANSITIVE pin: transformers' Config.swift breaks against Jinja 2.4.0's ObjectKey
  # API change, and transformers only demands jinja ≥2.0 — this top-level reference
  # forces the resolver to the last compatible tag. Drop when transformers is bumped
  # to a Jinja-2.4-aware release.
  swift-jinja:
    url: https://github.com/huggingface/swift-jinja.git
    exactVersion: "2.3.6"
  # EmbeddingGemma-300M on the ANE (Connections panel / P8) — same pin as the iOS
  # app (one engine, two apps; its swift-transformers ≥1.0 range accepts our 1.3.0 pin).
  CoreMLLLM:
    url: https://github.com/john-rocky/CoreML-LLM
    from: "1.9.0"
  # TRANSITIVE pin (unused by any target): swift-collections ≥1.7.0 strong-links
  # `_swift_initBorrow`, which is absent from the iOS 26.x runtimes' libswiftCore —
  # dyld abort at launch. Root cause: swiftlang/swift#92574 (unmerged); tracked at
  # swift-collections#733. Drop this pin once a toolchain ships the fix.
  swift-collections:
    url: https://github.com/apple/swift-collections
    exactVersion: 1.6.0

targets:
  SkriftDesktop:
    type: application
    platform: macOS
    sources:
      - path: App
      - path: Models
      - path: Pipeline
      - path: Engines
      - path: Features
      # Shared cross-app source (one physical copy → no phone↔Mac drift).
      # Model: the shared CloudKit @Models (Memo, MemoAsset, MemoEnhancement) + DeviceID,
      # so the Mac can be a CloudKit client of the phone's note store (MAC_CLOUDKIT_PLAN.md).
      # Pipeline: pure parity algorithms both apps must run identically (vocab
      # parsing/trust, fusion, voice match, BPE merge, image markers).
      - path: ../Shared/Naming
      - path: ../Shared/Export
      - path: ../Shared/Model
      - path: ../Shared/Pipeline
      # Body v2 (Q11): beside v1 until the swap (C2).
      - path: ../Shared/BodyV2
      # Corpus: the DEBUG-only synthetic-corpus seeder (test-fixtures/corpus, v2 rewrite gate).
      - path: ../Shared/Corpus
      - path: ../Shared/Recording
      # One-shot CoreLocation fix (shared with iOS) — a Mac recording now carries
      # a place like a phone one. CMPedometer steps stay phone-only; macOS has none.
      - path: ../Shared/Metadata
      # Model download: the resumable/streaming replacement for #hubDownloader().
      # APP TARGETS ONLY — it imports MLXLMCommon, which test bundles don't link.
      - path: ../Shared/ModelDownload
      # Session: the shared LockGate (per-device unlock state for locked notes).
      - path: ../Shared/Session
      # UI: shared SwiftUI helpers (FlowLayout — one copy across both apps + the extension).
      - path: ../Shared/UI
      # Retrieval: the P8 embedding index core (EmbeddingIndex/Store/MemoEmbedding +
      # engine seam + gist) — one copy; powers the Connections panel (mocks/related-panel.html).
      - path: ../Shared/Retrieval
      # RetrievalEngine: the CoreML-LLM-bound GemmaEmbedder — APP target only,
      # never the test bundles (tests use MockEmbedder; the package link stays out).
      - path: ../Shared/RetrievalEngine
    settings:
      base:
        PRODUCT_NAME: SkriftDesktop
        MACOSX_DEPLOYMENT_TARGET: "15.0"
        SWIFT_VERSION: "5.9"
        GENERATE_INFOPLIST_FILE: YES
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.productivity"
        # The Mac records too (2026-07-28). macOS TCC needs this string even though the app is
        # NOT sandboxed — without it, requesting mic access kills the process rather than
        # prompting. (`com.apple.security.device.audio-input` is a SANDBOX entitlement and is
        # deliberately absent: there is no sandbox here.)
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Skrift records voice memos on this Mac. Audio is transcribed on-device and never leaves your machine."
        # Location parity with the phone (Tuur, 2026-08-27): a note recorded on the Mac had
        # an empty `location:` because only iOS ever captured a place. macOS prompts once.
        INFOPLIST_KEY_NSLocationUsageDescription: "Skrift tags each memo with where you recorded it, the same as on your phone."
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "Skrift tags each memo with where you recorded it, the same as on your phone."
        # App icon from App/Assets.xcassets (macOS squircle, full size set).
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Team signing — REQUIRED for CloudKit (the Mac joins the phone's private DB to read
        # synced memos + write enhancements back; MAC_CLOUDKIT_PLAN.md). NOT sandboxed on
        # purpose (the app reads the Obsidian vault + arbitrary audio paths); CloudKit works in
        # a non-sandboxed dev/Developer-ID-signed Mac app. The iCloud CloudKit container is
        # declared per-config in the .entitlements below; registering it on the App ID is a
        # one-time manual Xcode "Signing & Capabilities" visit (the CLI can't add a capability).
        # The host-less UnitTests bundle keeps its OWN ad-hoc signing, so the fast MLX-free
        # test loop still runs without a provisioning profile.
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 9W82X49JZS
        ENABLE_HARDENED_RUNTIME: NO
      configs:
        # Dev/prod separation. Debug = "Skrift Dev" (com.skrift.desktop.dev) → its own
        # ~/Library/Application Support/Skrift Dev/ + SwiftData store + defaults to the
        # TEST vault (AppPaths/SettingsStore #if DEBUG), so dev runs never touch the
        # production data or the real Obsidian vault. Release = the real "Skrift".
        # PRODUCT_NAME drives CFBundleName (the macOS app-menu / menu-bar name) AND the
        # .app filename — the reliable lever (INFOPLIST_KEY_CFBundleName is dropped by the
        # plist generator, so the menu bar fell back to "SkriftDesktop" for both). Now dev
        # vs prod are unmistakable everywhere: "Skrift Dev" vs "Skrift".
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: com.skrift.desktop.dev
          PRODUCT_NAME: Skrift Dev
          INFOPLIST_KEY_CFBundleDisplayName: Skrift Dev
          ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon-Dev   # inverted-color dev icon
          CODE_SIGN_ENTITLEMENTS: SkriftDesktop.dev.entitlements
        Release:
          PRODUCT_BUNDLE_IDENTIFIER: com.skrift.desktop
          PRODUCT_NAME: Skrift
          INFOPLIST_KEY_CFBundleDisplayName: Skrift
          CODE_SIGN_ENTITLEMENTS: SkriftDesktop.entitlements
    dependencies:
      - package: FluidAudio
        product: FluidAudio
      - package: ZIPFoundation
        product: ZIPFoundation
      - package: mlx-swift-lm
        product: MLXLLM
      - package: mlx-swift-lm
        product: MLXLMCommon
      - package: mlx-swift-lm
        product: MLXHuggingFace
      - package: swift-huggingface
        product: HuggingFace
      - package: swift-transformers
        product: Tokenizers
      - package: CoreMLLLM
        product: CoreMLLLM

  # Host-less logic test bundle — proves `xcodebuild test` runs the unit harness.
  # Host-less logic tests: macOS hosted tests flakily hang on the testmanagerd
  # control session, so we compile the pure-logic sources straight into the test
  # bundle instead of @testable-importing the app. Keep FluidAudio/mlx-using files
  # OUT of here (they belong to integration/manual verification).
  SkriftDesktopTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: SkriftDesktopTests
      - path: Models
      - path: Pipeline
      # NEW pure-logic folder (LiveRecordingDraft/LiveRecordingFinalize, the 2026-07-28
      # LIVE-ENGINE lane) — explicit per `BRIEF_LIVEENGINE.md` (granted for this one edit).
      - path: Pipeline/Recording
      # Pure-arithmetic layout rule from Features/ (imports CoreGraphics only —
      # the rest of Features/ is SwiftUI and would drag the whole app in).
      - path: Features/Review/NoteMeasure.swift
      # The recorder, file-by-file for the same reason: it imports only AVFoundation +
      # CoreAudio (system frameworks), while the rest of Engines/ is FluidAudio and MLX and
      # would turn the fast MLX-free loop into the slow one. What's under test is the
      # REFUSAL mapping — the part that decides whether a user who can't record is offered a
      # way out — which needs no microphone to exercise.
      - path: Engines/MacRecorder.swift
      # Shared cross-app source (host-less test bundle compiles it directly, like Models/Pipeline).
      - path: ../Shared/Naming
      - path: ../Shared/Export
      - path: ../Shared/Model
      - path: ../Shared/Pipeline
      # Body v2 (Q11): beside v1 until the swap (C2).
      - path: ../Shared/BodyV2
      # Corpus: the DEBUG-only synthetic-corpus seeder (test-fixtures/corpus, v2 rewrite gate).
      - path: ../Shared/Corpus
      - path: ../Shared/Recording
      # `MacLocationStamp` is in Pipeline/Ingest, which this bundle compiles, so the shared
      # one-shot it calls has to be here too.
      - path: ../Shared/Metadata
      - path: ../Shared/Retrieval
      # The colour TABLE only (hex values, zero UI types by design — see its header).
      # Not all of Shared/UI: FlowLayout beside it is SwiftUI and would drag the app in,
      # same reason NoteMeasure is pulled file-by-file above.
      - path: ../Shared/UI/Palette.swift
      # Same discipline, same reason it's testable: the importance control's
      # past-the-wall mix is channel arithmetic over Palette, no UI types.
      - path: ../Shared/UI/SignificanceWarmFill.swift
      # The cross-app label table (Foundation-only strings). Pulled in because
      # Shared/Pipeline's NoteWorkState names its buttons from it, and this bundle
      # compiles all of Shared/Pipeline.
      - path: ../Shared/UI/SharedCopy.swift
      # Q26 unified notes list: chip counts / day groups / pill rule, Foundation-only
      # (no SwiftUI), same discipline as Palette/SharedCopy above.
      - path: ../Shared/UI/NotesListModel.swift
      # Q28 tag revamp: the C93/D139 split + library-fold rules, Foundation-only
      # (no SwiftUI), same discipline as Palette/SharedCopy above.
      - path: ../Shared/UI/TagRules.swift
      # Q58 sweep E: the ONE lock-visibility predicate both apps' isLocked(_:) route
      # through — Foundation-only, same file-by-file discipline as Palette/SharedCopy
      # above (the rest of Shared/Session pulls in LocalAuthentication/AppKit).
      - path: ../Shared/Session/NoteVisibility.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.skrift.desktop.unittests
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        SWIFT_VERSION: "5.9"
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_REQUIRED: NO

  SkriftDesktopUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: SkriftDesktopUITests
    dependencies:
      - target: SkriftDesktop
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.skrift.desktop.uitests
        TEST_TARGET_NAME: SkriftDesktop
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        SWIFT_VERSION: "5.9"
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_REQUIRED: NO

schemes:
  SkriftDesktop:
    build:
      targets:
        SkriftDesktop: all
        SkriftDesktopTests: [test]
        SkriftDesktopUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - SkriftDesktopTests
        - SkriftDesktopUITests

  # Fast loop: builds + runs ONLY the host-less logic tests (no app target, so no
  # FluidAudio/MLX compile). Use `-scheme UnitTests` for the routine test cycle.
  UnitTests:
    build:
      targets:
        SkriftDesktopTests: [test]
    test:
      config: Debug
      targets:
        - SkriftDesktopTests
